name: Creator Web CI

on:
  push:
    branches: [ "feat/creator-web-right-navigation" ]
    paths:
      - "creator-web/**"
      - ".github/workflows/creator-web.yml"
  pull_request:
    branches: [ "feat/port-native-creator-workspace" ]
    paths:
      - "creator-web/**"
      - ".github/workflows/creator-web.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creator-web/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Creator Web
        run: npm run build
